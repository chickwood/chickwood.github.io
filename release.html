<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

  <div class="wrap">
    <header>
      <a class="brand" href="index.html"><span class="dot"></span><span data-i18n="site_title"></span></a>
      <div id="langSwitcher"></div>
    </header>

    <div>
      <div class="tagline-head">
        <p class="tagline-title" id="projectName"></p>
        <a class="icon-link" href="index.html" data-i18n="back_to_projects"></a>
      </div>
      <p class="tagline-subtitle" id="projectDescription"></p>
      <p class="tagline-additional" id="projectAdditionalDescription" hidden></p>
    </div>

    <div class="gallery-section" id="gallerySection" style="display:none;">
      <p class="section-label" data-i18n="screenshots"></p>
      <div class="gallery" id="gallery"></div>
    </div>

    <div id="content">
      <div class="state"></div>
    </div>

    <footer>
      <span id="updatedAt"></span>
      <a id="repoLinkFooter" href="#" target="_blank" rel="noopener">
        <img src="https://api.iconify.design/mdi/github.svg?color=%23DCECFF" width="24" height="24" alt="GitHub" />
      </a>
    </footer>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
    <figure class="lightbox-body">
      <img id="lightboxImage" src="" alt="" draggable="false">
      <button type="button" class="lightbox-close" id="lightboxClose"><img src="https://api.iconify.design/mdi/close-circle.svg?color=%23DCECFF" width="40" height="40" alt="" draggable="false"></button>
    </figure>
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/escape.js"></script>
  <script src="assets/render.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectKey = params.get('project');

    let currentProject = null;

    async function init() {
      await initI18n();

      const res = await fetch('config/projects.json');
      const projects = await res.json();
      currentProject = projects.find(p => p.key === projectKey);

      if (!currentProject) {
        document.getElementById('content').innerHTML = `<div class="state error">${t('project_not_found')}</div>`;
        return;
      }

      renderProjectChrome();
      bindGalleryLightbox();
      await loadAndRenderProject(currentProject.key);
    }

    function renderProjectChrome() {
      const repoUrl = `https://github.com/${currentProject.owner}/${currentProject.repo}`;
      document.getElementById('projectName').textContent = tField(currentProject.name);
      document.getElementById('projectDescription').textContent = tField(currentProject.description);
      const additionalDescription = document.getElementById('projectAdditionalDescription');
      const additionalDescriptionText = tField(currentProject.additionalDescription).trim();
      additionalDescription.textContent = additionalDescriptionText;
      additionalDescription.hidden = !additionalDescriptionText;
      document.getElementById('repoLinkFooter').href = repoUrl;
      document.title = `${tField(currentProject.name)} - ${t('site_title')}`;
      renderGallery();
    }

    function renderGallery() {
      const section = document.getElementById('gallerySection');
      const track = document.getElementById('gallery');
      const gallery = currentProject.gallery || {};
      const items = gallery[currentLocale] || gallery.en || [];

      if (!items || items.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      track.innerHTML = items.map(item => {
        const caption = escapeHtml(item.caption);
        const src = escapeHtml(item.src);
        return `
      <div class="gallery-item">
        <button type="button" class="gallery-zoom" data-src="${src}" data-caption="${caption}" aria-label="${caption}">
          <img src="${src}" alt="${caption}" loading="lazy">
        </button>
        <p class="gallery-caption">${caption}</p>
      </div>
    `;
      }).join('');
    }

    function bindGalleryLightbox() {
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxClose = document.getElementById('lightboxClose');

      let lastTrigger = null;

      const openLightbox = (src, caption, trigger) => {
        lastTrigger = trigger || null;
        lightboxImage.src = src;
        lightboxImage.alt = caption;
        lightbox.setAttribute('aria-label', caption || t('screenshots'));
        lightboxClose.setAttribute('aria-label', t('close'));
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        lightboxClose.focus();
      };

      const closeLightbox = () => {
        if (lightbox.hidden) return;
        lightbox.hidden = true;
        lightboxImage.src = '';
        document.body.style.overflow = '';
        if (lastTrigger) {
          lastTrigger.focus();
          lastTrigger = null;
        }
      };

      document.getElementById('gallery').addEventListener('click', event => {
        const trigger = event.target.closest('.gallery-zoom');
        if (trigger) openLightbox(trigger.dataset.src, trigger.dataset.caption || '', trigger);
      });

      lightbox.addEventListener('click', () => closeLightbox());

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeLightbox();
        if (!lightbox.hidden && event.key === 'Tab') {
          event.preventDefault();
          lightboxClose.focus();
        }
      });
    }

    function onLocaleChange() {
      if (currentProject) {
        renderProjectChrome();
        loadAndRenderProject(currentProject.key);
      }
    }

    init();
  </script>

</body>

</html>
